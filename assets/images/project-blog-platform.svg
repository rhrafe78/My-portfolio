<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" fill="none">
  <defs>
    <linearGradient id="blgBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="blgViolet" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="blgCard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1f2937" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#111827" stop-opacity="0.95" />
    </linearGradient>
  </defs>

  <rect width="600" height="380" fill="url(#blgBg)" />
  <rect width="600" height="36" fill="#1f2937" />
  <circle cx="20" cy="18" r="5" fill="#ef4444" />
  <circle cx="36" cy="18" r="5" fill="#f59e0b" />
  <circle cx="52" cy="18" r="5" fill="#10b981" />
  <rect x="180" y="8" width="240" height="20" rx="6" fill="#111827" />
  <text x="300" y="22" font-family="monospace" font-size="10" fill="#a855f7" text-anchor="middle">blog-platform-auth.local</text>

  <!-- Navbar inside Mockup -->
  <rect x="20" y="50" width="560" height="42" rx="8" fill="#1f2937" stroke="#374151" />
  <text x="40" y="76" font-family="sans-serif" font-size="16" font-weight="bold" fill="url(#blgViolet)">DevPulse<tspan fill="#ffffff">Blog</tspan></text>
  <rect x="155" y="60" width="65" height="22" rx="4" fill="#374151" />
  <text x="187" y="75" font-family="sans-serif" font-size="10" fill="#f3f4f6" text-anchor="middle">Feed</text>
  <text x="250" y="75" font-family="sans-serif" font-size="10" fill="#9ca3af">Topics</text>
  <text x="310" y="75" font-family="sans-serif" font-size="10" fill="#9ca3af">Bookmarks</text>
  
  <!-- User Profile Pill -->
  <rect x="430" y="58" width="135" height="26" rx="13" fill="#8b5cf6" fill-opacity="0.2" stroke="#8b5cf6" />
  <circle cx="445" cy="71" r="7" fill="#8b5cf6" />
  <text x="498" y="75" font-family="sans-serif" font-size="10" font-weight="bold" fill="#f3f4f6" text-anchor="middle">Rafe (Author)</text>

  <!-- Featured Blog Post Card -->
  <g transform="translate(20, 106)">
    <rect width="360" height="254" rx="10" fill="url(#blgCard)" stroke="#374151" />
    <rect x="18" y="18" width="80" height="20" rx="4" fill="#8b5cf6" fill-opacity="0.2" />
    <text x="58" y="32" font-family="sans-serif" font-size="9.5" font-weight="bold" fill="#c084fc" text-anchor="middle">DJANGO MTV</text>
    
    <text x="18" y="60" font-family="sans-serif" font-size="15" font-weight="bold" fill="#ffffff">Building Scalable Web Platforms with Python &amp; Django</text>
    
    <text x="18" y="85" font-family="sans-serif" font-size="11" fill="#9ca3af">
      A comprehensive deep dive into user authentication, relational schemas,
    </text>
    <text x="18" y="103" font-family="sans-serif" font-size="11" fill="#9ca3af">
      comment threads, and responsive UI integration using Tailwind.
    </text>

    <!-- Author Badge & Read Time -->
    <circle cx="30" cy="138" r="12" fill="#3b82f6" />
    <text x="30" y="142" font-size="11" fill="#ffffff" text-anchor="middle">R</text>
    <text x="48" y="136" font-family="sans-serif" font-size="11" font-weight="bold" fill="#e5e7eb">Ridwoanul Haque Rafe</text>
    <text x="48" y="149" font-family="sans-serif" font-size="9" fill="#6b7280">Published today • 5 min read</text>

    <!-- Interactive Engagement Bar (Likes, Comments) -->
    <rect x="18" y="174" width="324" height="60" rx="8" fill="#111827" stroke="#374151" />
    
    <rect x="30" y="188" width="80" height="30" rx="6" fill="#ec4899" fill-opacity="0.15" stroke="#ec4899" stroke-width="0.8" />
    <text x="70" y="207" font-family="sans-serif" font-size="11" font-weight="bold" fill="#f472b6" text-anchor="middle">❤️ 128 Likes</text>

    <rect x="120" y="188" width="95" height="30" rx="6" fill="#3b82f6" fill-opacity="0.15" stroke="#3b82f6" stroke-width="0.8" />
    <text x="167" y="207" font-family="sans-serif" font-size="11" font-weight="bold" fill="#60a5fa" text-anchor="middle">💬 34 Comments</text>

    <rect x="225" y="188" width="105" height="30" rx="6" fill="url(#blgViolet)" />
    <text x="277" y="207" font-family="sans-serif" font-size="10.5" font-weight="bold" fill="#ffffff" text-anchor="middle">Read Article</text>
  </g>

  <!-- Right Side: Trending Authors & Recent Comments -->
  <g transform="translate(395, 106)">
    <rect width="185" height="254" rx="10" fill="url(#blgCard)" stroke="#374151" />
    <text x="16" y="28" font-family="sans-serif" font-size="11" font-weight="bold" fill="#e5e7eb">Community Activity</text>
    
    <!-- Comment 1 -->
    <rect x="12" y="44" width="161" height="56" rx="6" fill="#111827" stroke="#1f2937" />
    <text x="22" y="60" font-family="sans-serif" font-size="9" font-weight="bold" fill="#a855f7">@dev_tanvir</text>
    <text x="22" y="74" font-family="sans-serif" font-size="8.5" fill="#9ca3af">"Great explanation of MTV</text>
    <text x="22" y="86" font-family="sans-serif" font-size="8.5" fill="#9ca3af">architecture in Django!"</text>

    <!-- Comment 2 -->
    <rect x="12" y="108" width="161" height="56" rx="6" fill="#111827" stroke="#1f2937" />
    <text x="22" y="124" font-family="sans-serif" font-size="9" font-weight="bold" fill="#38bdf8">@sarah_codes</text>
    <text x="22" y="138" font-family="sans-serif" font-size="8.5" fill="#9ca3af">"The user auth flow is</text>
    <text x="22" y="150" font-family="sans-serif" font-size="8.5" fill="#9ca3af">super clean and secure."</text>

    <!-- Create Post CTA -->
    <rect x="12" y="180" width="161" height="58" rx="8" fill="#8b5cf6" fill-opacity="0.2" stroke="#8b5cf6" />
    <text x="92" y="204" font-family="sans-serif" font-size="11" font-weight="bold" fill="#c084fc" text-anchor="middle">+ New Blog Post</text>
    <text x="92" y="222" font-family="sans-serif" font-size="8.5" fill="#9ca3af" text-anchor="middle">Markdown &amp; Image Upload</text>
  </g>
</svg>