<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" fill="none">
  <defs>
    <linearGradient id="hspBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#081020" />
      <stop offset="100%" stop-color="#020712" />
    </linearGradient>
    <linearGradient id="hspCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="hspEmerald" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
  </defs>

  <rect width="600" height="380" fill="url(#hspBg)" />
  
  <!-- Browser Window Top Bar -->
  <rect width="600" height="36" fill="#0f172a" />
  <circle cx="20" cy="18" r="5" fill="#ef4444" />
  <circle cx="36" cy="18" r="5" fill="#f59e0b" />
  <circle cx="52" cy="18" r="5" fill="#10b981" />
  <rect x="180" y="8" width="240" height="20" rx="6" fill="#020617" stroke="#1e293b" />
  <text x="300" y="22" font-family="monospace" font-size="10" fill="#38bdf8" text-anchor="middle">hospital-portal.django.local</text>

  <!-- Navigation / Header Bar inside Mockup -->
  <rect x="20" y="50" width="560" height="44" rx="8" fill="#0f172a" stroke="#1e293b" />
  <g transform="translate(36, 62)">
    <!-- Red/Cyan Cross Logo -->
    <rect x="0" y="6" width="20" height="8" rx="2" fill="url(#hspCyan)" />
    <rect x="6" y="0" width="8" height="20" rx="2" fill="url(#hspCyan)" />
    <text x="30" y="15" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff">MediCare<tspan fill="#38bdf8">Portal</tspan></text>
  </g>
  
  <rect x="420" y="60" width="144" height="24" rx="12" fill="#06b6d4" fill-opacity="0.15" stroke="#06b6d4" stroke-width="1" />
  <circle cx="433" cy="72" r="4" fill="#10b981" />
  <text x="490" y="76" font-family="sans-serif" font-size="9.5" font-weight="600" fill="#38bdf8" text-anchor="middle">REST API Connected</text>

  <!-- Left Sidebar: Clinical Modules -->
  <g transform="translate(20, 106)">
    <rect width="145" height="254" rx="8" fill="#0b1324" stroke="#1e293b" />
    <text x="16" y="24" font-family="sans-serif" font-size="10" font-weight="bold" fill="#94a3b8" letter-spacing="1">CLINICAL MODULES</text>
    
    <rect x="10" y="38" width="125" height="26" rx="6" fill="#0284c7" fill-opacity="0.2" stroke="#0284c7" stroke-width="1" />
    <text x="22" y="55" font-family="sans-serif" font-size="10" font-weight="bold" fill="#38bdf8">Appointments</text>
    
    <text x="22" y="86" font-family="sans-serif" font-size="10" fill="#94a3b8">Doctors Directory</text>
    <text x="22" y="114" font-family="sans-serif" font-size="10" fill="#94a3b8">Patient History</text>
    <text x="22" y="142" font-family="sans-serif" font-size="10" fill="#94a3b8">Prescriptions</text>
    <text x="22" y="170" font-family="sans-serif" font-size="10" fill="#94a3b8">Billing &amp; Invoices</text>
    <text x="22" y="198" font-family="sans-serif" font-size="10" fill="#94a3b8">Staff Permissions</text>
    
    <rect x="12" y="218" width="121" height="24" rx="6" fill="#1e293b" />
    <text x="72" y="233" font-family="monospace" font-size="9" fill="#10b981" text-anchor="middle">Django ORM: Active</text>
  </g>

  <!-- Main Content: Stats Row -->
  <g transform="translate(180, 106)">
    <!-- Stat 1 -->
    <rect width="125" height="60" rx="8" fill="#0b1324" stroke="#1e293b" />
    <text x="14" y="22" font-family="sans-serif" font-size="9.5" fill="#94a3b8">Scheduled Today</text>
    <text x="14" y="48" font-family="sans-serif" font-size="20" font-weight="bold" fill="#ffffff">48 <tspan font-size="11" fill="#10b981">Patients</tspan></text>

    <!-- Stat 2 -->
    <rect x="135" width="125" height="60" rx="8" fill="#0b1324" stroke="#1e293b" />
    <text x="149" y="22" font-family="sans-serif" font-size="9.5" fill="#94a3b8">Available Doctors</text>
    <text x="149" y="48" font-family="sans-serif" font-size="20" font-weight="bold" fill="#38bdf8">14 <tspan font-size="11" fill="#94a3b8">On Duty</tspan></text>

    <!-- Stat 3 -->
    <rect x="270" width="130" height="60" rx="8" fill="#0b1324" stroke="#1e293b" />
    <text x="284" y="22" font-family="sans-serif" font-size="9.5" fill="#94a3b8">Database Schema</text>
    <text x="284" y="48" font-family="monospace" font-size="14" font-weight="bold" fill="#a78bfa">PostgreSQL</text>
  </g>

  <!-- Main Content: Appointments Table Mockup -->
  <g transform="translate(180, 178)">
    <rect width="400" height="182" rx="8" fill="#0b1324" stroke="#1e293b" />
    
    <!-- Table Header -->
    <rect width="400" height="28" rx="8" fill="#0f172a" />
    <text x="16" y="18" font-family="sans-serif" font-size="9.5" font-weight="bold" fill="#94a3b8">PATIENT ID</text>
    <text x="100" y="18" font-family="sans-serif" font-size="9.5" font-weight="bold" fill="#94a3b8">DOCTOR</text>
    <text x="205" y="18" font-family="sans-serif" font-size="9.5" font-weight="bold" fill="#94a3b8">DEPARTMENT</text>
    <text x="320" y="18" font-family="sans-serif" font-size="9.5" font-weight="bold" fill="#94a3b8">STATUS</text>

    <!-- Row 1 -->
    <text x="16" y="54" font-family="monospace" font-size="9.5" fill="#f8fafc">#PT-1049</text>
    <text x="100" y="54" font-family="sans-serif" font-size="10" font-weight="600" fill="#ffffff">Dr. Sarah Adams</text>
    <text x="205" y="54" font-family="sans-serif" font-size="9.5" fill="#94a3b8">Cardiology</text>
    <rect x="315" y="42" width="70" height="18" rx="9" fill="#10b981" fill-opacity="0.2" />
    <text x="350" y="54" font-family="sans-serif" font-size="9" font-weight="bold" fill="#34d399" text-anchor="middle">CONFIRMED</text>

    <!-- Row 2 -->
    <line x1="10" y1="68" x2="390" y2="68" stroke="#1e293b" stroke-width="1" />
    <text x="16" y="90" font-family="monospace" font-size="9.5" fill="#f8fafc">#PT-1052</text>
    <text x="100" y="90" font-family="sans-serif" font-size="10" font-weight="600" fill="#ffffff">Dr. Michael Chen</text>
    <text x="205" y="90" font-family="sans-serif" font-size="9.5" fill="#94a3b8">Neurology</text>
    <rect x="315" y="78" width="70" height="18" rx="9" fill="#0284c7" fill-opacity="0.2" />
    <text x="350" y="90" font-family="sans-serif" font-size="9" font-weight="bold" fill="#38bdf8" text-anchor="middle">IN SESSION</text>

    <!-- Row 3 -->
    <line x1="10" y1="104" x2="390" y2="104" stroke="#1e293b" stroke-width="1" />
    <text x="16" y="126" font-family="monospace" font-size="9.5" fill="#f8fafc">#PT-1055</text>
    <text x="100" y="126" font-family="sans-serif" font-size="10" font-weight="600" fill="#ffffff">Dr. Emily Watson</text>
    <text x="205" y="126" font-family="sans-serif" font-size="9.5" fill="#94a3b8">Pediatrics</text>
    <rect x="315" y="114" width="70" height="18" rx="9" fill="#f59e0b" fill-opacity="0.2" />
    <text x="350" y="126" font-family="sans-serif" font-size="9" font-weight="bold" fill="#fbbf24" text-anchor="middle">PENDING</text>

    <!-- Row 4 -->
    <line x1="10" y1="140" x2="390" y2="140" stroke="#1e293b" stroke-width="1" />
    <text x="16" y="162" font-family="monospace" font-size="9.5" fill="#f8fafc">#PT-1058</text>
    <text x="100" y="162" font-family="sans-serif" font-size="10" font-weight="600" fill="#ffffff">Dr. Robert Brown</text>
    <text x="205" y="162" font-family="sans-serif" font-size="9.5" fill="#94a3b8">Orthopedics</text>
    <rect x="315" y="150" width="70" height="18" rx="9" fill="#10b981" fill-opacity="0.2" />
    <text x="350" y="162" font-family="sans-serif" font-size="9" font-weight="bold" fill="#34d399" text-anchor="middle">CONFIRMED</text>
  </g>
</svg>
